<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetak ID Card Peserta Didik</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
body{font-family:'Poppins',sans-serif;background:#f1f5f9}
.loader{border:4px solid #e2e8f0;border-top:4px solid #3b82f6;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== ID CARD (kalibrasi tidak diubah) ===== */
.id-card{width:55mm;height:85mm;position:relative;overflow:hidden;background:#fff;box-sizing:border-box}
.card-bg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.card-content{position:absolute;inset:0;z-index:2}
.c-rs-logo{position:absolute;top:3mm;left:3mm;height:9mm;width:auto;object-fit:contain} /* atur posisi logo RSUD di sini */
.c-photo{position:absolute;top:15mm;left:2.929mm;width:25.929mm;height:25.929mm;border-radius:50%;object-fit:cover;background:#fff}
.c-text-area{position:absolute;top:21mm;left:32mm;right:2mm;text-align:left}
.c-name{font-size:7.7pt;font-weight:800;color:#111;margin-bottom:1.5mm;line-height:1.15}
.c-major{font-size:6pt;font-weight:800;margin-bottom:2mm;line-height:1.15}
.c-label{font-size:6pt;font-weight:800;color:#111;margin-top:1mm;line-height:1.1}
.c-value{font-size:6pt;font-weight:500;color:#111;line-height:1.1}
.c-inst-logo{position:absolute;bottom:12mm;left:9.5mm;width:10mm;height:10mm;object-fit:contain}
.c-inst-name{position:absolute;bottom:4.5mm;left:6.3mm;width:16mm;text-align:center;font-size:4pt;font-weight:700;line-height:1.1;display:flex;flex-direction:column;justify-content:center;align-items:center}
.c-qr-container{position:absolute;bottom:9mm;right:4mm;width:22mm;height:22mm;background:#fff;display:flex;justify-content:center;align-items:center}
.c-qr-container img,.c-qr-container canvas{width:100%!important;height:100%!important}

/* ===== A4 ===== */
.a4-page{position:relative;width:210mm;height:297mm;padding-top:21mm;padding-left:22.5mm;display:grid;grid-template-columns:repeat(3,55mm);grid-auto-rows:85mm;gap:0;box-sizing:border-box;background:#fff;overflow:hidden;margin:0 auto 2rem;box-shadow:0 10px 25px rgba(0,0,0,.2);flex-shrink:0}
.cut-line-v{position:absolute;top:0;bottom:0;width:0;border-left:.5pt dashed #000;z-index:999}
.cut-line-h{position:absolute;left:0;right:0;height:0;border-top:.5pt dashed #000;z-index:999}

/* ===== Multi-select ===== */
.ms-panel{max-height:15rem;overflow-y:auto}
@media print{
 @page{size:A4 portrait;margin:0}
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;margin:0;padding:0}
 body>div:not(#previewUI){display:none!important}
 #previewUI{display:block!important;padding:0!important;background:transparent!important}
 #previewControls{display:none!important}
 #previewScrollArea{overflow:visible!important}
 .a4-page{margin:0!important;box-shadow:none!important;page-break-after:always}
}
</style>
</head>
<body class="text-slate-800 antialiased min-h-screen">

<div id="mainUI">
  <!-- HEADER STICKY: tombol & jumlah terpilih selalu terlihat -->
  <div class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <img src="img/rsudbk.png" alt="RSUD" class="h-11 w-auto object-contain" onerror="this.style.display='none'">
        <div>
          <h1 class="text-xl font-bold text-slate-900 leading-tight">Cetak ID Card Peserta Didik</h1>
          <p class="text-xs text-slate-500">Format A4, 9 kartu per halaman</p>
        </div>
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto">
        <span id="textSelected" class="text-blue-700 font-bold bg-blue-50 px-4 py-2 rounded-lg border border-blue-100 whitespace-nowrap">Terpilih: 0</span>
        <button onclick="prepareAndPrint()" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-xl shadow transition flex items-center justify-center gap-2">
          <i class="fas fa-eye"></i> Preview Cetak
        </button>
      </div>
    </div>
  </div>

  <div class="max-w-[90rem] mx-auto py-6 px-4 sm:px-6 lg:px-8">
    <!-- FILTER -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 items-end">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Gelombang</label>
        <select id="filterSheet" onchange="changeSheet(this.value)" class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:border-blue-500 font-medium bg-slate-50"></select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Institusi</label>
        <div id="msInst" class="relative"></div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Jenjang - Jurusan</label>
        <div id="msJur" class="relative"></div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Cari Nama / NIM</label>
        <div class="relative">
          <i class="fas fa-search absolute left-3 top-3.5 text-slate-400"></i>
          <input type="text" id="searchName" oninput="renderTable()" placeholder="Ketik nama / NIM..." class="w-full pl-9 rounded-lg border border-slate-300 p-2.5 outline-none focus:border-blue-500 bg-slate-50">
        </div>
      </div>
      <label class="flex items-center gap-2 p-2.5 rounded-lg border border-slate-300 bg-slate-50 cursor-pointer font-medium text-slate-700 text-sm">
        <input type="checkbox" id="filterBelumPrint" onchange="renderTable()" class="w-4 h-4 text-blue-600 rounded">
        Hanya yang belum diprint
      </label>
    </div>

    <div id="loadingState" class="flex flex-col items-center justify-center py-20">
      <div class="loader mb-4"></div>
      <p class="text-slate-500 font-medium" id="loadingText">Mengambil data peserta...</p>
    </div>

    <div id="tableContainer" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200">
              <th class="p-4 w-12 text-center"><input type="checkbox" id="checkAll" onchange="toggleAll()" class="w-4 h-4 cursor-pointer"></th>
              <th class="p-4 text-sm font-semibold text-slate-600 uppercase whitespace-nowrap">Nama & NIM</th>
              <th class="p-4 text-sm font-semibold text-slate-600 uppercase whitespace-nowrap">Institusi & Jurusan</th>
              <th class="p-4 text-sm font-semibold text-slate-600 uppercase whitespace-nowrap">Gelombang</th>
              <th class="p-4 text-sm font-semibold text-slate-600 uppercase whitespace-nowrap">Level / Print / SIMRS</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
      <div class="p-4 bg-slate-50 border-t border-slate-200 text-sm text-slate-500 font-medium" id="textTotal">Total: 0 Peserta</div>
    </div>
  </div>
</div>

<!-- PREVIEW -->
<div id="previewUI" class="hidden bg-slate-600 min-h-screen pb-10 pt-24">
  <div id="previewControls" class="fixed top-0 left-0 w-full bg-slate-800 text-white p-4 flex flex-col sm:flex-row justify-between items-center z-50 shadow-md gap-3">
    <div class="text-center sm:text-left">
      <h2 class="text-xl font-bold">Preview Cetak A4</h2>
      <p class="text-sm text-slate-300" id="previewStats"></p>
    </div>
    <div class="flex gap-3 w-full sm:w-auto justify-center">
      <button onclick="closePreview()" class="bg-slate-600 hover:bg-slate-500 px-4 py-2 rounded-lg font-semibold flex items-center gap-2"><i class="fas fa-arrow-left"></i> Kembali</button>
      <button id="btnCetak" onclick="window.print()" class="bg-blue-500 hover:bg-blue-400 px-4 py-2 rounded-lg font-semibold flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"><i class="fas fa-print"></i> Cetak</button>
    </div>
  </div>
  <div id="previewScrollArea" class="w-full overflow-x-auto flex flex-col items-center px-4">
    <div id="print-container" class="flex flex-col items-center"></div>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwmi6A5Vg1TqtY3q54J-hxf6khaFLtXw1KPup3g7TPmmuqA8zJok6YvfChZWZ0yCE4/exec";
// ^ Setelah deploy ulang Code.gs, ganti dengan URL deployment terbaru jika berubah.

const LEVELS = {
  1:{badge:'bg-emerald-100 text-emerald-700', bg:'hijau',  major:'#059669', inst:'#ffffff'},
  2:{badge:'bg-amber-100 text-amber-700',     bg:'kuning', major:'#d97706', inst:'#000000'},
  3:{badge:'bg-rose-100 text-rose-700',       bg:'merah',  major:'#dc2626', inst:'#ffffff'},
  4:{badge:'bg-sky-100 text-sky-700',         bg:'biru',   major:'#0284c7', inst:'#ffffff'}
};
const LV_DEFAULT = {badge:'bg-slate-100 text-slate-700', bg:'abu', major:'#64748b', inst:'#ffffff'};
const lv = p => LEVELS[Number(p.id_parent)] || LV_DEFAULT;

let sheetCache = {};            // {namaSheet: [peserta...]} -> tiap sheet hanya diminta sekali
let byKey = {};                 // key -> peserta (semua sheet yang pernah dimuat)
let currentSheet = '';
let selectedKeys = new Set();
let filt = { inst: new Set(), jur: new Set() };
let visibleList = [];

const makeKey = (nim, sheet) => String(nim).trim() + '::' + String(sheet).trim();
const sudahPrint = p => /^sudah/i.test(String(p.print).trim());
const jurLabel = p => [p.jenjangpend, p.jurusan].filter(Boolean).join(' - ') || '-';
const esc = s => (s == null) ? '' : String(s).replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));

function api(body) {
  return fetch(GAS_URL, { method: 'POST', headers: {'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) })
    .then(r => r.json())
    .then(r => { if (!r.success) throw new Error(r.message || 'Permintaan gagal'); return r; });
}

function storeSheet(name, rows) {
  rows.forEach(p => { p.sheetName = name; byKey[makeKey(p.nim, name)] = p; });
  sheetCache[name] = rows;
}

function formatPrintDate(s) {
  if (!s) return '-';
  let m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/), y, mo, d;
  if (m) { y = m[1]; mo = m[2]; d = m[3]; }
  else if ((m = String(s).match(/^(\d{1,2})-(\d{1,2})-(\d{4})/))) { d = m[1].padStart(2,'0'); mo = m[2]; y = m[3]; }
  else return esc(s);
  const mon = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return `${d} ${mon[+mo-1]} ${y.slice(-2)}`;
}

/* ================= LOAD AWAL: 1 request, langsung sheet terakhir ================= */
document.addEventListener('DOMContentLoaded', () => {
  api({ action: 'idcardInit' }).then(r => {
    const sel = document.getElementById('filterSheet');
    sel.innerHTML = r.sheets.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    sel.value = r.sheetName;
    currentSheet = r.sheetName;
    storeSheet(r.sheetName, r.data);
    showTable();
    refreshFilters();
  }).catch(e => {
    document.getElementById('loadingState').classList.add('hidden');
    Swal.fire('Error', e.message || 'Gagal memuat data dari server.', 'error');
  });
});

function showTable() {
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('tableContainer').classList.remove('hidden');
}

/* ================= GANTI GELOMBANG: baca hanya sheet itu ================= */
function changeSheet(name) {
  currentSheet = name;
  filt.inst.clear(); filt.jur.clear();
  if (sheetCache[name]) { refreshFilters(); return; }
  document.getElementById('tableContainer').classList.add('hidden');
  document.getElementById('loadingText').textContent = `Mengambil data ${name}...`;
  document.getElementById('loadingState').classList.remove('hidden');
  api({ action: 'idcardSheet', sheetName: name }).then(r => {
    storeSheet(name, r.data);
    if (currentSheet !== name) return;
    showTable(); refreshFilters();
  }).catch(e => { showTable(); Swal.fire('Error', e.message, 'error'); });
}

/* ================= FILTER BERTINGKAT (multi) ================= */
function uniq(arr) { return [...new Set(arr)].filter(Boolean).sort((a,b) => a.localeCompare(b)); }

function refreshFilters() {
  const rows = sheetCache[currentSheet] || [];
  const instOpts = uniq(rows.map(p => p.namasekolah));
  filt.inst = new Set([...filt.inst].filter(x => instOpts.includes(x)));
  const jurRows = filt.inst.size ? rows.filter(p => filt.inst.has(p.namasekolah)) : rows;
  const jurOpts = uniq(jurRows.map(jurLabel));
  filt.jur = new Set([...filt.jur].filter(x => jurOpts.includes(x)));
  renderMulti('msInst', instOpts, filt.inst, 'Semua Institusi', () => refreshFilters());
  renderMulti('msJur', jurOpts, filt.jur, 'Semua Jenjang - Jurusan', () => renderTable());
  renderTable();
}

function renderMulti(id, options, selected, placeholder, onChange) {
  const box = document.getElementById(id);
  const wasOpen = box.querySelector('.ms-panel') && !box.querySelector('.ms-panel').classList.contains('hidden');
  const txt = selected.size === 0 ? placeholder : (selected.size === 1 ? [...selected][0] : `${selected.size} dipilih`);
  box.innerHTML = `
    <button type="button" class="ms-btn w-full text-left rounded-lg border border-slate-300 p-2.5 bg-slate-50 font-medium text-slate-700 flex justify-between items-center gap-2">
      <span class="truncate">${esc(txt)}</span><i class="fas fa-chevron-down text-xs text-slate-400"></i>
    </button>
    <div class="ms-panel ${wasOpen ? '' : 'hidden'} absolute z-30 mt-1 w-full min-w-[16rem] bg-white border border-slate-200 rounded-lg shadow-xl p-2">
      <button type="button" class="ms-clear text-xs text-blue-600 font-semibold mb-1 px-1">Hapus pilihan</button>
      ${options.map((o, i) => `<label class="flex items-start gap-2 px-1 py-1.5 hover:bg-slate-50 rounded cursor-pointer text-sm">
        <input type="checkbox" data-i="${i}" class="mt-1" ${selected.has(o) ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('') || '<div class="text-sm text-slate-400 p-2">Tidak ada data</div>'}
    </div>`;
  const panel = box.querySelector('.ms-panel');
  box.querySelector('.ms-btn').onclick = e => { e.stopPropagation(); closePanels(panel); panel.classList.toggle('hidden'); };
  panel.onclick = e => e.stopPropagation();
  panel.querySelector('.ms-clear').onclick = () => { selected.clear(); onChange(); };
  panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
    const o = options[+cb.dataset.i];
    cb.checked ? selected.add(o) : selected.delete(o);
    onChange();
  });
}
function closePanels(except) { document.querySelectorAll('.ms-panel').forEach(p => { if (p !== except) p.classList.add('hidden'); }); }
document.addEventListener('click', () => closePanels());

/* ================= TABEL ================= */
function renderTable() {
  const rows = sheetCache[currentSheet] || [];
  const q = document.getElementById('searchName').value.trim().toLowerCase();
  const belum = document.getElementById('filterBelumPrint').checked;

  visibleList = rows.filter(p =>
    (!filt.inst.size || filt.inst.has(p.namasekolah)) &&
    (!filt.jur.size || filt.jur.has(jurLabel(p))) &&
    (!belum || !sudahPrint(p)) &&
    (!q || p.nama.toLowerCase().includes(q) || p.nim.toLowerCase().includes(q))
  );

  const tb = document.getElementById('tableBody');
  if (!visibleList.length) {
    tb.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500 font-medium"><i class="fas fa-inbox text-slate-400 mb-2 text-3xl block"></i>Tidak ada data peserta yang ditemukan.</td></tr>`;
  } else {
    tb.innerHTML = visibleList.map((p, i) => {
      const key = makeKey(p.nim, p.sheetName), chk = selectedKeys.has(key);
      const hasLv = p.id_parent && p.id_parent !== '0';
      return `<tr data-i="${i}" class="hover:bg-slate-50 cursor-pointer ${chk ? 'bg-blue-50' : ''}">
        <td class="p-4 text-center"><input type="checkbox" class="row-cb w-4 h-4 cursor-pointer" ${chk ? 'checked' : ''}></td>
        <td class="p-4"><div class="font-bold text-slate-800">${esc(p.nama)}</div><div class="text-xs text-slate-500 font-mono mt-0.5">${esc(p.nim)}</div></td>
        <td class="p-4"><div class="font-medium text-slate-700 text-sm">${esc(p.namasekolah)}</div><div class="text-xs text-slate-500">${esc(jurLabel(p))}</div></td>
        <td class="p-4"><span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200"><i class="fas fa-folder-open mr-1.5 text-slate-400"></i>${esc(p.sheetName)}</span></td>
        <td class="p-4 space-y-1">
          <div data-edit class="px-2 py-1 inline-block rounded text-xs font-bold ${lv(p).badge} hover:ring-2 hover:ring-offset-1" title="Klik untuk mengubah level">${hasLv ? 'Level ' + esc(p.id_parent) : 'Level Belum Diisi'} <i class="fas fa-edit ml-1 opacity-70"></i></div>
          <div class="text-[11px] font-medium text-slate-600"><i class="fas fa-print text-blue-500 w-4"></i> Print: <b>${esc(p.print) || '-'}</b></div>
          ${p.simrs ? `<div class="text-[11px] font-medium text-slate-600"><i class="fas fa-hospital text-emerald-500 w-4"></i> SIMRS: <b>${esc(p.simrs)}</b></div>` : ''}
        </td></tr>`;
    }).join('');
  }
  document.getElementById('textTotal').textContent = `Total: ${visibleList.length} Peserta (${currentSheet})`;
  syncCounts();
}

// Klik baris: TIDAK render ulang tabel, hanya ubah baris itu (posisi scroll tetap)
document.getElementById('tableBody').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-i]'); if (!tr) return;
  const p = visibleList[+tr.dataset.i];
  if (e.target.closest('[data-edit]')) { editLevel(p); return; }
  const key = makeKey(p.nim, p.sheetName);
  const cb = tr.querySelector('.row-cb');
  const on = e.target === cb ? cb.checked : !selectedKeys.has(key);
  on ? selectedKeys.add(key) : selectedKeys.delete(key);
  cb.checked = on;
  tr.classList.toggle('bg-blue-50', on);
  syncCounts();
});

function toggleAll() {
  const on = document.getElementById('checkAll').checked;
  visibleList.forEach(p => { const k = makeKey(p.nim, p.sheetName); on ? selectedKeys.add(k) : selectedKeys.delete(k); });
  document.querySelectorAll('#tableBody tr[data-i]').forEach(tr => {
    tr.querySelector('.row-cb').checked = on; tr.classList.toggle('bg-blue-50', on);
  });
  syncCounts();
}

function syncCounts() {
  document.getElementById('textSelected').innerHTML = `<i class="fas fa-check-double mr-1"></i> Terpilih: ${selectedKeys.size}`;
  document.getElementById('checkAll').checked = visibleList.length > 0 && visibleList.every(p => selectedKeys.has(makeKey(p.nim, p.sheetName)));
}

/* ================= EDIT LEVEL (kirim baris + NIM, tanpa pencarian) ================= */
function editLevel(p) {
  const cur = (p.id_parent && p.id_parent !== '0') ? String(p.id_parent) : '';
  Swal.fire({
    title: `Ubah Level: ${p.nama}`,
    html: `<select id="swal-lv" class="swal2-select" style="width:80%">
      <option value="">Kosongkan</option>${[1,2,3,4].map(n => `<option value="${n}" ${cur == n ? 'selected' : ''}>Level ${n}</option>`).join('')}</select>`,
    showCancelButton: true, confirmButtonText: 'Simpan', cancelButtonText: 'Batal',
    preConfirm: () => document.getElementById('swal-lv').value
  }).then(res => {
    if (!res.isConfirmed || res.value === cur) return;
    Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    api({ action: 'idcardUpdateLevel', sheetName: p.sheetName, row: p.row, nim: p.nim, newLevel: res.value })
      .then(() => { p.id_parent = res.value; renderTable(); Swal.fire({ icon: 'success', title: 'Level diperbarui', timer: 1200, showConfirmButton: false }); })
      .catch(e => Swal.fire('Gagal', e.message, 'error'));
  });
}

/* ================= PREVIEW & CETAK ================= */
let photoJobs = [], printedList = [];

function prepareAndPrint() {
  if (!selectedKeys.size) { Swal.fire('Peringatan', 'Pilih minimal 1 peserta untuk dipreview!', 'warning'); return; }
  const list = [...selectedKeys].map(k => byKey[k]).filter(Boolean);
  printedList = list;
  Swal.fire({ title: 'Menyiapkan Preview...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  const pc = document.getElementById('print-container');
  pc.innerHTML = '';
  let html = '', qrs = []; photoJobs = [];

  list.forEach((p, i) => {
    const L = lv(p);
    const name = esc((p.nama || 'Tanpa Nama').trim().toLowerCase().replace(/\b\w/g, c => c.toUpperCase()));
    const nim = p.nim || '-';
    html += `
      <div class="id-card">
        <img src="img/idcard/${L.bg}.jpg" class="card-bg" alt="bg">
        <div class="card-content">
          
          <img id="photo_${i}" src="" class="c-photo" title="Klik untuk memuat ulang foto">
          <div class="c-text-area">
            <div class="c-name">${name}</div>
            <div class="c-major" style="color:${L.major}">${esc(jurLabel(p))}</div>
            <div class="c-label">NIM - <span class="c-value">${esc(nim)}</span></div>
            <div class="c-label">PERIODE -</div>
            <div class="c-value">${formatPrintDate(p.tanggal_mulai)} - ${formatPrintDate(p.tanggal_selesai)}</div>
          </div>
          <img src="img/logo_institusi/${esc(p.namasekolah)}.png" class="c-inst-logo" onerror="this.style.display='none'">
          <div class="c-inst-name" style="color:${L.inst}"><span>${esc(p.namasekolah)}</span></div>
          <div id="qr_${i}" class="c-qr-container"></div>
        </div>
      </div>`;
    qrs.push({ id: `qr_${i}`, text: nim !== '-' ? nim : '00000000' });
    photoJobs.push({ imgId: `photo_${i}`, rawUrl: p.urlFoto });

    if ((i + 1) % 9 === 0 || i === list.length - 1) {
      const cuts = [22.5, 77.5, 132.5, 187.5].map(x => `<div class="cut-line-v" style="left:${x}mm"></div>`).join('') +
                   [21, 106, 191, 276].map(y => `<div class="cut-line-h" style="top:${y}mm"></div>`).join('');
      const page = document.createElement('div');
      page.className = 'a4-page';
      page.innerHTML = cuts + html;
      pc.appendChild(page);
      html = '';
    }
  });

  document.getElementById('mainUI').classList.add('hidden');
  document.getElementById('previewUI').classList.remove('hidden');
  document.getElementById('previewStats').textContent = `${list.length} Peserta • ${Math.ceil(list.length / 9)} Halaman A4`;

  qrs.forEach(q => new QRCode(document.getElementById(q.id), { text: q.text, width: 200, height: 200, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M }));

  // Muat foto (maks 6 paralel); tombol Cetak dikunci sampai semua selesai
  const btn = document.getElementById('btnCetak'); btn.disabled = true;
  let done = 0, cursor = 0;
  const upd = () => Swal.update({ title: 'Memuat Foto...', html: `Memuat foto peserta (${done}/${photoJobs.length})` });
  upd();
  const next = () => {
    if (cursor >= photoJobs.length) return Promise.resolve();
    const j = photoJobs[cursor++];
    return loadPhoto(j.imgId, j.rawUrl).then(() => { done++; upd(); return next(); });
  };
  Promise.all(Array.from({ length: 6 }, next)).then(() => {
    Swal.close(); btn.disabled = false; window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function endpoints(raw) {
  const m = String(raw || '').match(/[-\w]{25,}/);
  if (!m) return [];
  const id = m[0];
  return [`https://lh3.googleusercontent.com/d/${id}=w400`, `https://drive.google.com/thumbnail?id=${id}&sz=w400-h400`,
          `https://lh3.googleusercontent.com/d/${id}`, `https://drive.google.com/uc?export=view&id=${id}`];
}
const tryUrl = (el, url) => new Promise(res => { const t = new Image(); t.onload = () => { el.src = url; res(true); }; t.onerror = () => res(false); t.src = url; });

async function loadPhoto(imgId, raw) {
  const el = document.getElementById(imgId); if (!el) return;
  for (const u of endpoints(raw)) if (await tryUrl(el, u)) return;
  el.src = 'https://placehold.co/150x150/f87171/ffffff?text=Klik+Reload';
  el.style.cursor = 'pointer';
  el.onclick = async () => {
    el.src = 'https://placehold.co/150x150/60a5fa/ffffff?text=Memuat...';
    for (const u of endpoints(raw)) if (await tryUrl(el, u)) { el.onclick = null; return; }
    el.src = 'https://placehold.co/150x150/f87171/ffffff?text=Akses+Ditolak';
    Swal.fire('Foto Terblokir', 'Pastikan file di Google Drive diatur "Siapa saja yang memiliki link".', 'error');
  };
}

function closePreview() {
  document.getElementById('previewUI').classList.add('hidden');
  document.getElementById('mainUI').classList.remove('hidden');
  document.getElementById('print-container').innerHTML = '';
  window.scrollTo({ top: 0 });
}

// Setelah dialog cetak ditutup, tawarkan menandai status print = "Sudah"
window.addEventListener('afterprint', () => {
  if (document.getElementById('previewUI').classList.contains('hidden')) return;
  const todo = printedList.filter(p => !sudahPrint(p));
  if (!todo.length) return;
  Swal.fire({ title: 'Tandai sudah diprint?', text: `${todo.length} peserta akan diberi status "Sudah Di Print".`,
    icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, tandai', cancelButtonText: 'Tidak' })
  .then(r => {
    if (!r.isConfirmed) return;
    Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    api({ action: 'idcardMarkPrinted', items: todo.map(p => ({ sheetName: p.sheetName, row: p.row, nim: p.nim })) })
      .then(() => { todo.forEach(p => p.print = 'Sudah Di Print'); Swal.fire({ icon: 'success', title: 'Status print diperbarui', timer: 1200, showConfirmButton: false }); })
      .catch(e => Swal.fire('Gagal', e.message, 'error'));
  });
});
</script>
